<title>Wing — Interactive Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#FFFBF8; --surface:#FFFFFF; --ink:#2A2230; --ink-soft:#6E6068; --ink-faint:#9A8C93;
    --line:#F0E4DD; --line-soft:#F6ECE6; --accent:#D6456A; --accent-soft:#FBEEF1;
    --positive:#2F5D62; --positive-soft:#E9F2F0; --gold:#E0A03C; --warn:#B77410; --warn-soft:#F5E9D6;
    --chip:#F4EBE7; --shadow:0 2px 10px -6px rgba(60,30,45,.2);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#17131A; --surface:#201A22; --ink:#F1EAEE; --ink-soft:#C4B8C0; --ink-faint:#8E8390;
    --line:#362E3B; --line-soft:#2A232F; --accent:#F2718F; --accent-soft:#3A2530;
    --positive:#7FC0C3; --positive-soft:#1E2E30; --gold:#E0A64E; --warn:#E0A64E; --warn-soft:#2E2515;
    --chip:#2A232F; --shadow:0 2px 10px -6px rgba(0,0,0,.5);
  }}
  :root[data-theme="light"]{--bg:#FFFBF8;--surface:#FFFFFF;--ink:#2A2230;--ink-soft:#6E6068;--ink-faint:#9A8C93;--line:#F0E4DD;--line-soft:#F6ECE6;--accent:#D6456A;--accent-soft:#FBEEF1;--positive:#2F5D62;--positive-soft:#E9F2F0;--gold:#E0A03C;--warn:#B77410;--warn-soft:#F5E9D6;--chip:#F4EBE7;}
  :root[data-theme="dark"]{--bg:#17131A;--surface:#201A22;--ink:#F1EAEE;--ink-soft:#C4B8C0;--ink-faint:#8E8390;--line:#362E3B;--line-soft:#2A232F;--accent:#F2718F;--accent-soft:#3A2530;--positive:#7FC0C3;--positive-soft:#1E2E30;--gold:#E0A64E;--warn:#E0A64E;--warn-soft:#2E2515;--chip:#2A232F;}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  button{font:inherit;border:none;background:none;color:inherit;padding:0;cursor:pointer;text-align:left}
  input,textarea{font:inherit;color:var(--ink)}

  #app{max-width:520px;margin:0 auto;height:100vh;height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
  .screen.on{display:flex}
  /* Screens are flex columns, so children default to flex-shrink:1 and get
     COMPRESSED when the screen overflows — horizontally-scrolling rows
     (chip filters, coach strips) collapsed to slivers. Everything keeps its
     natural height and the screen scrolls instead. .chat is the one exception:
     it must flex to fill and scroll internally. */
  .screen > *:not(.chat){flex:0 0 auto}

  .demobar{background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;padding:7px 14px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
  .coachrule{height:3px;background:var(--positive);flex:0 0 auto;display:none}
  .coachrule.on{display:block}

  .apphead{padding:14px 16px 8px}
  .greet{font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .apphead h1{margin:2px 0 0;font-size:25px;font-weight:600;letter-spacing:-.01em}
  .topbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
  /* was 13x31 for the bare chevron — below any usable tap target */
  .backbtn{font-size:15px;color:var(--ink-faint);min-width:44px;min-height:40px;display:inline-flex;align-items:center;margin-left:-8px;padding-left:8px}
  .sechead{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:16px 16px 7px;display:flex;justify-content:space-between;align-items:center}

  .av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto}
  .av-lg{width:66px;height:66px;font-size:23px}.av-md{width:46px;height:46px;font-size:17px}
  .av-sm{width:32px;height:32px;font-size:13px}.av-xs{width:44px;height:44px;font-size:16px}
  .row{display:flex;gap:11px;align-items:center}
  .nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
  .vtick{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:#2F8C6A;color:#fff;font-size:9px;font-weight:800}
  .hl{font-size:12.5px;color:var(--ink-faint);margin-top:1px}
  .stars{color:var(--gold);letter-spacing:1px}

  /* home */
  .needs{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;padding:12px 13px;margin:0 14px 8px;display:flex;gap:11px;align-items:center;width:calc(100% - 28px);box-shadow:var(--shadow)}
  .needs .ni{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .needs b{font-size:13.5px;display:block}
  .needs span{font-size:11.5px;color:var(--ink-faint)}
  .needs .arr{margin-left:auto;color:var(--ink-faint);flex:0 0 auto}
  .throw{display:flex;gap:11px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-soft);width:100%}
  .throw .iw{min-width:0;flex:1}
  .throw .tnm{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700}
  .meter{margin-left:auto;font-size:9.5px;font-weight:700;padding:2.5px 8px;border-radius:999px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.03em;flex:0 0 auto}
  .meter.a{background:var(--accent-soft);color:var(--accent)}
  .meter.d{background:var(--positive-soft);color:var(--positive)}
  .meter.w{background:var(--warn-soft);color:var(--warn)}
  /* display:block is required — inline elements ignore overflow/text-overflow,
     so the snippet ran off the right edge instead of truncating */
  .snip{display:block;min-width:0;font-size:12.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .throw .tnm{min-width:0}
  .throw .tnm > :first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .udot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .rtime{font-size:10px;color:var(--ink-faint);font-family:ui-monospace,Menlo,monospace;flex:0 0 auto;align-self:flex-start;padding-top:3px}
  .coachstrip{display:flex;gap:14px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none}
  .coachstrip::-webkit-scrollbar{display:none}
  .cs{text-align:center;flex:0 0 auto;width:58px}
  .cs .av{margin:0 auto 4px;position:relative}
  .cs .csn{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs .fav{position:absolute;right:-2px;bottom:-2px;background:var(--bg);border-radius:50%;width:17px;height:17px;display:grid;place-items:center;font-size:9px;color:var(--accent)}
  .cs.addc .av{background:var(--chip)!important;color:var(--ink-faint);border:1px dashed var(--ink-faint)}

  /* discover */
  .chiprow{display:flex;gap:7px;padding:10px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft)}
  .fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .search{margin:8px 16px 0;display:block;width:calc(100% - 32px);background:var(--chip);border:none;border-radius:12px;padding:11px 14px;font-size:16px}
  .search::placeholder{color:var(--ink-faint)}
  .search:focus{outline:2px solid var(--accent)}
  .list{padding:10px 14px 24px;display:flex;flex-direction:column;gap:10px}
  .ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:relative}
  /* 44px minimum tap target — the heart was 19x27 and hard to hit */
  .heart{position:absolute;right:4px;top:4px;width:44px;height:44px;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--ink-faint)}
  .heart.on{color:var(--accent)}
  .ccard .fromp{margin-left:auto;text-align:right;flex:0 0 auto;padding-right:26px}
  .ccard .fromp b{display:block;font-size:15px;color:var(--accent)}
  .ccard .fromp span{font-size:10.5px;color:var(--ink-faint)}
  .meta{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-soft);align-items:center;flex-wrap:wrap}
  .signals{font-size:11px;color:var(--positive);margin-top:4px;font-family:ui-monospace,Menlo,monospace}
  .spec{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .schip{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .schip.t{background:var(--positive-soft);color:var(--positive)}

  /* profile */
  .phero{text-align:center;padding:18px 16px 4px}
  .phero .av{margin:0 auto}
  .phero h2{font-size:22px;margin:9px 0 2px;font-weight:600}
  .statrow{display:flex;margin:14px 16px 4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 0}
  .stat{flex:1;text-align:center}
  .stat+.stat{border-left:1px solid var(--line-soft)}
  .stat b{display:block;font-size:15px}
  .stat span{font-size:10.5px;color:var(--ink-faint)}
  .offer{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 14px 8px;width:calc(100% - 28px)}
  .oi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--accent-soft);flex:0 0 auto}
  .oi.t{background:var(--positive-soft)}.oi.a{background:var(--warn-soft)}
  .ow{min-width:0}.ow b{font-size:13.5px;display:block}
  .ow span{font-size:11px;color:var(--ink-faint)}
  .op{margin-left:auto;font-weight:700;font-size:13.5px;color:var(--accent);white-space:nowrap}
  .rev{margin:2px 14px 9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .rev .rt{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;flex-wrap:wrap}
  .rev p{font-size:12.5px;color:var(--ink-soft);margin:5px 0 0}
  .cta{display:block;width:calc(100% - 28px);margin:6px 14px 16px;background:var(--accent);color:#fff;text-align:center;font-weight:700;font-size:15px;border-radius:14px;padding:14px;box-shadow:0 6px 16px -8px rgba(214,69,106,.6)}
  .cta.dark{background:var(--ink);color:var(--bg);box-shadow:none}

  /* thread */
  .tw b{font-size:14.5px;display:block}.tw span{font-size:10.5px;color:#2F8C6A;font-weight:600}
  .itembar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--accent);width:100%}
  .itembar .edot{width:6px;height:6px;border-radius:50%;background:#2F8C6A;flex:0 0 auto}
  .itembar .cnt{margin-left:auto;flex:0 0 auto;opacity:.8}
  .itembar.warn{background:var(--warn-soft);color:var(--warn);border-bottom-color:var(--warn-soft)}
  .itembar.calm{background:var(--positive-soft);color:var(--positive)}
  /* min-height:0 lets the chat shrink and scroll internally instead of growing
     the screen and pushing the composer below the fold in long threads */
  #s-thread{overflow:hidden}
  .chat{flex:1;min-height:0;padding:12px 12px 8px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  /* without this, flex children shrink to fit and messages get squashed
     instead of the chat scrolling */
  .chat > *{flex:0 0 auto}
  .msg{max-width:84%;padding:9px 13px;border-radius:16px;font-size:14px}
  .msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px}
  .msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
  .freetag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--positive);background:var(--positive-soft);padding:2px 7px;border-radius:999px;margin-top:6px;font-family:ui-monospace,Menlo,monospace}
  .shot{align-self:flex-end;width:62%;border-radius:13px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
  .shot .simg{height:62px;background:linear-gradient(160deg,#EFE2DA 25%,#E5D3CE 25% 50%,#EFE2DA 50% 75%,#E5D3CE 75%);position:relative}
  .shot .simg::after{content:"⌁ hinge_convo.png";position:absolute;inset:auto 0 0 0;font-size:9px;padding:3px 8px;background:rgba(42,34,48,.82);color:#FFF7F2;font-family:ui-monospace,Menlo,monospace}

  /* ANSWER CARD — the headline of v2 */
  .acard{align-self:flex-start;width:93%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .ahead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--accent-soft);font-family:ui-monospace,Menlo,monospace;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
  .ahead .who{opacity:.75;font-weight:600}
  .abody{padding:11px 12px 4px;font-size:14px;line-height:1.5}
  .ablock{margin:8px 12px 4px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:10px 12px;font-size:13.5px;line-height:1.45}
  .ablock .blab{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.07em;color:var(--ink-faint);display:block;margin-bottom:4px}
  .ablock .bcopy{display:block;width:100%;margin-top:8px;text-align:center;font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:9px 6px}
  .aacts{display:flex;gap:6px;padding:9px 12px 11px}
  .aact{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--chip);border-radius:9px;padding:7px 0}
  .aact.on{color:var(--accent);background:var(--accent-soft)}
  .aact.dots{flex:0 0 44px}

  .icard{align-self:flex-start;width:93%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .icard.warn{border-color:var(--warn)}
  .icard .ot{display:flex;align-items:center;gap:9px}
  .icard .ot b{font-size:13.5px;display:block}.icard .ot span{font-size:10.5px;color:var(--ink-faint)}
  .os{margin-left:auto;font-size:9px;font-weight:700;padding:3px 8px;border-radius:999px;font-family:ui-monospace,Menlo,monospace;background:var(--positive-soft);color:var(--positive);flex:0 0 auto}
  .os.w{background:var(--warn-soft);color:var(--warn)}
  .tline{display:flex;margin:11px 2px 3px}
  .tstep{flex:1;text-align:center;font-size:8.5px;color:var(--ink-faint);font-family:ui-monospace,Menlo,monospace}
  .tstep::before{content:"";display:block;width:9px;height:9px;border-radius:50%;background:var(--positive);margin:0 auto 4px}
  .tstep.pend::before{background:var(--line)}
  .tstep.cur::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .filechip{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:11.5px;font-weight:600}
  .obtns{display:flex;gap:7px;margin-top:10px}
  .qb{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:9px 0;border-radius:10px}
  .qb.yes{background:var(--accent);color:#fff}
  .qb.no{background:var(--chip);color:var(--ink-soft)}
  .onote{text-align:center;font-size:10px;color:var(--ink-faint);margin-top:8px;font-family:ui-monospace,Menlo,monospace}
  .compose{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);flex:0 0 auto}
  .cfield{flex:1;min-width:0;background:var(--chip);border:none;border-radius:999px;padding:11px 15px;font-size:16px}
  .cfield:focus{outline:2px solid var(--accent)}
  .csend{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}

  /* saved */
  .scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:0 14px 9px}
  .scard .sh{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);display:flex;justify-content:space-between;gap:8px}
  .scard .sb{font-size:13.5px;margin-top:6px;line-height:1.45}
  .scard .sacts{display:flex;gap:6px;margin-top:9px}

  /* you */
  .yrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft);width:100%;font-size:14.5px}
  .yrow .yi{width:22px;text-align:center;font-size:16px;flex:0 0 auto}
  .yrow .arr{margin-left:auto;color:var(--ink-faint)}
  .modecard{margin:12px 14px;background:var(--positive-soft);border:1px solid var(--positive);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px;width:calc(100% - 28px)}
  .modecard b{font-size:14px;display:block;color:var(--positive)}
  .modecard span{font-size:11.5px;color:var(--ink-soft)}

  /* coach */
  .etile{margin:10px 14px;background:var(--ink);border-radius:16px;padding:16px 18px;color:var(--bg)}
  .etile .el{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600}
  .etile .ev{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:700;margin-top:2px}
  .etile .es{font-size:11.5px;opacity:.75;margin-top:4px}
  .etiles2{display:flex;gap:8px;margin:0 14px 10px}
  .et2{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
  .et2 b{font-family:ui-monospace,Menlo,monospace;font-size:16px;display:block}
  .et2 span{font-size:9.5px;color:var(--ink-faint)}
  .qrow{margin:0 14px 8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
  .qrow.late{border-color:var(--warn);background:var(--warn-soft)}
  .due{margin-left:auto;font-size:9px;color:var(--warn);font-weight:700;background:var(--bg);padding:3px 8px;border-radius:999px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;flex:0 0 auto}
  .due.ok{color:var(--positive)}

  .empty{text-align:center;color:var(--ink-faint);padding:40px 30px;font-size:13.5px}
  .empty .serif{font-size:20px;color:var(--ink);display:block;margin-bottom:8px}

  /* tabs + sheets */
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
  .tab{flex:1;text-align:center;padding:9px 0 7px;font-size:10px;font-weight:600;color:var(--ink-faint)}
  .tab .ticon{display:block;font-size:19px;margin-bottom:1px}
  .tab.on{color:var(--accent)}
  .scrim{position:absolute;inset:0;background:rgba(20,12,18,.45);z-index:20;display:none}
  .scrim.on{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.9,.3,1);max-height:84%;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
  .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 14px}
  .srow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-soft);padding:11px 2px;font-size:13px;color:var(--ink-soft)}
  .srow b{color:var(--ink);font-weight:600}
  .paybtn{display:block;width:100%;margin-top:14px;background:#000;color:#fff;border-radius:14px;text-align:center;padding:15px;font-weight:700;font-size:16px}
  .paynote{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.5}
  .trayrow{display:flex;gap:11px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;width:100%}
  .trayrow.inuse{border-color:var(--accent)}
  .trayrow.done{opacity:.55}
  .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
  .trayrow.inuse .radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 42%,transparent 48%)}

/* ---------------- thread ---------------- */
function ensureThread(h){if(!state.threads[h])state.threads[h]={messages:[],engagements:[],inUseId:null,unread:0};}
function addMsg(h,m){ensureThread(h);m.id="m"+(++state.msgSeq);state.threads[h].messages.push(m);}
function inUse(h){const t=state.threads[h];if(!t)return null;return t.engagements.find(e=>e.id===t.inUseId&&e.status==="active"&&e.unitsUsed<e.unitsTotal)||null;}
function coachFree(h,text){setTimeout(()=>{addMsg(h,{kind:"coach",text});bump(h);},1200+Math.random()*700);}
function coachAnswer(h,forDeliverable){
  setTimeout(()=>{
    const c=COACHES[h],th=state.threads[h];
    const i=(state.answerIdx[h]||0);state.answerIdx[h]=i+1;
    const a=c.answers[i%c.answers.length];
    const eng=forDeliverable?th.engagements.find(e=>e.status==="delivered"):inUse(h);
    let label=null;
    if(eng&&!forDeliverable){eng.unitsUsed++;
      label=`${eng.unit==="photo"?"PHOTO":"ANSWER"} ${eng.unitsUsed} OF ${eng.unitsTotal}`;
      if(eng.unitsUsed>=eng.unitsTotal){eng.status="completed";th.inUseId=null;setTimeout(()=>promptReview(h,eng.id),900);}
    } else if(forDeliverable&&eng){label="DELIVERED · "+eng.title.toUpperCase();}
    const msg={kind:"answer",a,label,engId:eng?eng.id:null,spec:eng?eng.spec:null,saved:true};
    addMsg(h,msg);
    state.saved.unshift({id:msg.id,h,spec:eng?eng.spec:"openers",title:eng?eng.title:"Answer",a,when:"just now",pinned:false});
    bump(h);
  },1500+Math.random()*800);
}
function bump(h){const th=state.threads[h];
  if(state.screen==="thread"&&state.coach===h)renderThread();else{th.unread++;if(state.screen==="home")renderHome();}
  renderTabs();}
function openThread(h){state.coach=h;ensureThread(h);state.threads[h].unread=0;renderThread();go("thread");}
function barFor(h){
  const t=state.threads[h],c=COACHES[h],a=inUse(h);
  const chat=t.engagements.filter(e=>e.scheme==="per_unit"||e.scheme==="pack");
  const d=t.engagements.find(e=>e.status==="delivered");
  if(a){const w=a.unit==="photo"?"photos":"answers";return{cls:"",txt:`Using · ${a.title} — ${a.unitsTotal-a.unitsUsed} ${w} left`};}
  if(d)return{cls:"calm",txt:`${d.title} — approve to release ${money(d.amount)} →`};
  if(chat.length)return{cls:"warn",txt:"No answers left · Buy more →"};
  if(t.engagements.length)return{cls:"calm",txt:"Tap to see your items"};
  return{cls:"calm",txt:`Browse ${first(c.name)}'s menu →`};
}
function renderThread(){
  const h=state.coach,c=COACHES[h],t=state.threads[h];
  const prev=$("cinput"),keep=prev?prev.value:"";

     <span class="tw"><b>${c.name}</b><span>● online now</span></span>
     <button class="backbtn" style="margin-left:auto" onclick="openProfile('${h}')">menu</button></div>
    <button class="itembar ${bar.cls}" onclick="openTray()"><span class="edot"></span>${bar.txt}<span class="cnt">${t.engagements.length>1?t.engagements.length+" items ⌄":""}</span></button>

    <div class="compose"><input class="cfield" id="cinput" placeholder="Message ${first(c.name)}…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="csend" onclick="sendMsg()">➤</button></div>`;
  if(keep)$("cinput").value=keep;
  const l=$("chatlog");l.scrollTop=l.scrollHeight;
}
function renderMsg(m,h){
  const c=COACHES[h];
  if(m.kind==="sys")return `<div class="onote" style="align-self:center">${esc(m.text)}</div>`;
  if(m.kind==="me")return `<div class="msg me">${esc(m.text)}</div>`;
  if(m.kind==="shot")return `<div class="shot"><div class="simg"></div></div>`;
  if(m.kind==="coach")return `<div class="msg them">${esc(m.text)}<div><span class="freetag">FREE</span></div></div>`;
  if(m.kind==="answer"){
    const sv=state.saved.find(s=>s.id===m.id);
    return `<div class="acard">
      <div class="ahead"><span>${m.label||"ANSWER"}</span><span class="who">${first(c.name)} · now</span></div>
      <div class="abody">${esc(m.a.r)}</div>
      ${m.a.c?`<div class="ablock"><span class="blab">SEND THIS</span>${esc(m.a.c)}<button class="bcopy" onclick="copyMsg('${m.id}',this)">${state.copiedId===m.id?"✓ Copied":"⧉ Copy"}</button></div>`:""}
      <div class="aacts">
        ${m.a.c?`<button class="aact" onclick="copyMsg('${m.id}',this)">⧉ Copy</button>`:""}
        <button class="aact ${sv&&sv.pinned?"on":""}" onclick="pinMsg('${m.id}',this)">${sv&&sv.pinned?"♥ Saved":"♡ Save"}</button>
        <button class="aact dots" onclick="toast('Opens a dispute about this answer')">⋯</button>
      </div></div>`;
  }
  if(m.kind==="offer"){
    return `<div class="icard" style="border-color:var(--accent)">
      <div class="ot"><span class="oi">✦</span><span><b>${esc(m.o.title)}</b><span>Offer from ${c.name}</span></span><span class="os w">${m.o.state||"OFFER"}</span></div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:8px">${esc(m.o.desc)}</div>
      ${m.o.state?`<div class="onote" style="margin-top:9px">accepted · ${money(m.o.price)} paid</div>`
        :`<div class="obtns"><button class="qb yes" onclick="acceptOffer('${h}','${m.id}')">Accept · ${money(m.o.price)}</button><button class="qb no" onclick="toast('Declined — no charge')">Not now</button></div>
          <div class="onote">expires in 7 days · you're only charged if you accept</div>`}</div>`;
  }
  if(m.kind==="item"){
    const e=state.threads[h].engagements.find(x=>x.id===m.engId);if(!e)return"";
    const isCall=e.scheme==="live";
    const steps=isCall?[]:["Paid","In prog","Deliv","Appr"];
    const cur=e.status==="in_progress"?1:e.status==="delivered"?2:3;
    return `<div class="icard"><div class="ot"><span class="oi t">${e.icon}</span><span><b>${e.title}</b><span>${c.name} · ${money(e.amount)}</span></span><span class="os ${e.status==="in_progress"?"w":""}">${isCall?"BOOKED":e.status.replace("_"," ").toUpperCase()}</span></div>
      ${isCall?`<div class="onote" style="margin-top:9px">Friday 7:00 PM · reminder 15 min before</div>`
      :`<div class="tline">${steps.map((s,i)=>`<span class="tstep ${i<cur?"":i===cur?"cur":"pend"}">${s}</span>`).join("")}</div>
        ${e.status==="delivered"?`<div class="filechip">📎 ${e.title.toLowerCase().replace(/ /g,"_")}.txt</div>
          <div class="obtns"><button class="qb yes" onclick="approveItem('${h}','${e.id}')">Approve</button><button class="qb no" onclick="toast('Change request sent')">Request changes</button></div>
          <div class="onote">${money(e.amount)} releases on approval · auto-approves Friday</div>`
        :e.status==="approved"||e.status==="completed"?`<div class="onote">approved · ${money(e.amount)} released to ${first(c.name)}</div>`
        :`<div class="onote">in progress — usually ${c.resp}</div>`}`}
      </div>`;
  }
  return "";
}
function sendMsg(){
  const i=$("cinput"),txt=i.value.trim();if(!txt)return;
  const h=state.coach;addMsg(h,{kind:"me",text:txt});i.value="";renderThread();
  const n=(state.freeIdx[h]||0);state.freeIdx[h]=n+1;
  const c=COACHES[h];
  if(n===0&&inUse(h))coachFree(h,c.frees[0]);
  else if(inUse(h))coachAnswer(h);
  else coachFree(h,c.frees[Math.min(n,c.frees.length-1)]);
}
function copyMsg(id,btn){
  state.copiedId=id;setTimeout(()=>{if(state.copiedId===id)state.copiedId=null;},1500);
  const h=state.coach||(state.saved.find(s=>s.id===id)||{}).h;
  let txt=null;
  Object.values(state.threads).forEach(t=>t.messages.forEach(m=>{if(m.id===id&&m.a)txt=m.a.c||m.a.r;}));
  if(!txt){const s=state.saved.find(x=>x.id===id);if(s)txt=s.a.c||s.a.r;}
  try{navigator.clipboard&&navigator.clipboard.writeText(txt||"");}catch(e){}
  if(btn){const o=btn.textContent;btn.textContent="✓ Copied";setTimeout(()=>btn.textContent=o,1500);}
  toast("Copied — paste it in your dating app");

function pinMsg(id,btn){
